name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

    # second deploy always waits for the first if deployments are done at the same
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev

  qa:
    needs: dev
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: qa

  prod:
    needs: qa
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
